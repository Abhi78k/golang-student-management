version: "3.9"

services:
  postgres:
    image: postgres:17
    container_name: student-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: hydrogen
      POSTGRES_DB: student_management
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: student-redis
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: student-api
    depends_on:
      - postgres
      - redis
    env_file:
      - .env.docker
    ports:
      - "8080:8080"

volumes:
  postgres_data:
